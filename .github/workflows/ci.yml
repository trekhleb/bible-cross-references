name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Redeploy by hand, e.g. after changing the Pages settings.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Type check, lint, format, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Keep the built site for deployment
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  # Publishes main to trekhleb.dev/bible-cross-references/, once every check has passed. The domain
  # comes from the owner's user site; builds already use the /bible-cross-references/ base path.
  deploy:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # One deployment at a time; a running one always finishes.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
