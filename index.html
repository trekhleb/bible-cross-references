<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Title and description only: the build plugins in vite/ add the rest of the head (icons,
         canonical URL, Open Graph and Twitter cards, structured data). -->
    <meta
      name="description"
      content="Explore all 344,799 Bible cross-references: every verse on one line with its links as arcs, and every chapter with threads to where its verses connect."
    />
    <title>%SITE_NAME%</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      %SITE_NAME% draws the 344,799 cross-references between the verses of the Bible. It needs
      JavaScript to run.
    </noscript>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
